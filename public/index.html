<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airodump - P2P Transfer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="glass-container">
        <header>
            <h1>Airo<span>dump</span></h1>
            <p>Peer-to-peer file transfer</p>
        </header>

        <div id="room-section" class="section active">
            <h2>Secure Connection</h2>
            <p>Create a secure room or join an existing one.</p>
            
            <div class="connection-options">
                <div class="create-room-box">
                    <button id="create-btn" class="primary-btn">Create Secure Room</button>
                    <div id="created-code-container" class="hidden mt-4">
                        <p>Share this code:</p>
                        <div class="code-display">
                            <span id="generated-code">----</span>
                            <button id="copy-btn" class="btn icon-btn" title="Copy Code">📋</button>
                        </div>
                    </div>
                </div>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="join-room-box">
                    <div class="input-group">
                        <input type="text" id="room-input" placeholder="Code (e.g. AB12)" maxlength="4" style="text-transform: uppercase;" />
                        <button id="join-btn" class="secondary-btn">Join Room</button>
                    </div>
                </div>
            </div>
            
            <p id="room-status" class="status-text mt-4"></p>
        </div>

        <div id="transfer-section" class="section hidden">
            <div class="transfer-top-bar">
                <div class="connection-status">
                    <span class="status-dot connected"></span> Connected to peer
                </div>
                <button class="reload-action-btn icon-btn" title="Reload Session">
                    🔄 Reload
                </button>
            </div>
            
            <div class="transfer-grid">
                <!-- Left Panel: Upload, Progress & Downloads -->
                <div class="transfer-left-col">
                    <div class="file-upload-wrapper">
                        <input type="file" id="file-input" class="file-input" multiple>
                        <div class="upload-area" id="upload-area">
                            <svg viewBox="0 0 24 24" width="40" height="40" stroke="currentColor" stroke-width="2" fill="none">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <p>Drag & drop or click to select file(s)</p>
                            <span id="selected-file-name" class="file-name"></span>
                        </div>
                    </div>

                    <div id="progress-container" class="hidden">
                        <div class="progress-info">
                            <span id="progress-text">Sending...</span>
                            <span id="progress-percentage">0%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div id="progress-bar" class="progress-bar-fill"></div>
                        </div>
                    </div>

                    <div id="download-container" class="hidden mt-4">
                        <p id="download-status-text">File(s) received successfully!</p>
                        <div id="download-list" class="download-list mt-4"></div>
                    </div>
                </div>

                <!-- Right Panel: Controls & Buttons -->
                <div class="transfer-right-col">
                    <button id="send-btn" class="primary-btn" disabled>Send File(s)</button>
                    <button id="send-another-btn" class="secondary-btn hidden">📁 Send Another File</button>
                    <button class="reload-action-btn secondary-btn">🔄 Reload Session</button>
                </div>
            </div>
        </div>
    </div>

    <a href="https://about.me/notrazx" target="_blank" class="about-btn">About</a>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
